<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#ECEFF3; --border:#D9DFE6;
    --ink:#12161C; --ink-2:#4A5568; --muted:#8792A2;
    --accent:#9C6A12; --accent-soft:#F4E7CE; --accent-ink:#6E4A0C;
    --good:#0CA30C; --good-soft:#DEF3DE; --good-ink:#0B7A0B;
    --critical:#D03B3B; --critical-soft:#FBE2E2; --critical-ink:#A22A2A;
    --grid:#E1E5EA; --shadow: 0 1px 2px rgba(18,22,28,.04), 0 8px 24px -12px rgba(18,22,28,.10);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#0A0E15; --surface:#121826; --surface-2:#1A2233; --border:#2A3446;
      --ink:#E9EEF5; --ink-2:#AEB8C8; --muted:#7C8698;
      --accent:#E0A64B; --accent-soft:#3A2C16; --accent-ink:#F0C27E;
      --good:#2FBE6E; --good-soft:#123B22; --good-ink:#5BD98D;
      --critical:#E8685F; --critical-soft:#3D1A19; --critical-ink:#F0938B;
      --grid:#232D40; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0A0E15; --surface:#121826; --surface-2:#1A2233; --border:#2A3446;
    --ink:#E9EEF5; --ink-2:#AEB8C8; --muted:#7C8698;
    --accent:#E0A64B; --accent-soft:#3A2C16; --accent-ink:#F0C27E;
    --good:#2FBE6E; --good-soft:#123B22; --good-ink:#5BD98D;
    --critical:#E8685F; --critical-soft:#3D1A19; --critical-ink:#F0938B;
    --grid:#232D40; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--ink); margin:0; padding-inline:16px; padding-block:20px 40px; }
  .wrap{ max-width:1040px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  .view{ display:flex; flex-direction:column; gap:18px; }
  .view[hidden]{ display:none; }
  h1,h2,h3{ font-family:"Archivo", system-ui, sans-serif; margin:0; letter-spacing:-0.01em; }
  .num{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .eyebrow{ font-family:"IBM Plex Mono", monospace; font-size:11px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  a{ color:inherit; }


  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); }
  .header{ padding:18px 20px; }
  .header-top{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; justify-content:space-between; }
  .title-block{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .title-block h1{ font-size:22px; }
  .sub{ color:var(--ink-2); font-size:13.5px; }
  .pill{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid transparent; }
  .pill-exchange{ background:var(--surface-2); color:var(--ink-2); border-color:var(--border); font-family:"IBM Plex Mono",monospace; white-space:nowrap; }
  .pill-roll{ background:var(--accent-soft); color:var(--accent-ink); }
  .pill-bear{ background:var(--critical-soft); color:var(--critical-ink); }
  .pill-status{ background:var(--surface-2); color:var(--ink-2); border-color:var(--border); white-space:nowrap; }
  .pill-status .dot{ width:7px; height:7px; border-radius:50%; background:var(--muted); }

  .price-row{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:18px 28px; margin-top:16px; }
  .price-hero{ font-size:44px; font-weight:700; font-family:"Archivo",sans-serif; line-height:1; }
  .chg{ display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:10px; font-weight:600; font-size:15px; }
  .chg.up{ background:var(--good-soft); color:var(--good-ink); }
  .chg.down{ background:var(--critical-soft); color:var(--critical-ink); }
  .chg svg{ width:13px; height:13px; }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(96px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-top:16px; }
  .stat{ background:var(--surface); padding:10px 12px; }
  .stat .eyebrow{ margin-bottom:4px; }
  .stat .v{ font-size:15px; font-weight:600; }

  .grid2{ display:grid; grid-template-columns: 1fr 1.35fr; gap:16px; align-items:start; }
  @media (max-width:760px){ .grid2{ grid-template-columns:1fr; } }
  .panel{ padding:18px 20px; }
  .panel h2{ font-size:15px; }
  .panel .desc, .desc{ color:var(--muted); font-size:12.5px; margin-top:3px; }

  .ladder{ margin-top:14px; display:flex; flex-direction:column; }
  .rung{ position:relative; display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px dashed var(--border); }
  .rung:last-child{ border-bottom:none; }
  .rung .rail{ position:relative; width:12px; display:flex; justify-content:center; flex-shrink:0; }
  .rung .rail::before{ content:""; position:absolute; top:-11px; bottom:-11px; width:2px; background:var(--border); }
  .rung:first-child .rail::before{ top:50%; }
  .rung:last-child .rail::before{ bottom:50%; }
  .rung .dot{ position:relative; z-index:1; width:10px; height:10px; border-radius:50%; border:2px solid var(--surface); }
  .dot-r{ background:var(--critical); }
  .dot-s{ background:var(--good); }
  .dot-p{ background:var(--muted); }
  .dot-c{ background:var(--accent); width:13px; height:13px; box-shadow:0 0 0 3px var(--accent-soft); }
  .rung .price{ font-size:15px; font-weight:600; min-width:96px; }
  .rung .meta{ flex:1; min-width:0; }
  .rung .tag{ font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
  .tag-r{ color:var(--critical-ink); }
  .tag-s{ color:var(--good-ink); }
  .tag-p{ color:var(--ink-2); }
  .tag-c{ color:var(--accent-ink); }
  .rung .label{ font-size:12.5px; color:var(--ink-2); margin-top:1px; }
  .rung.current{ background:var(--accent-soft); margin-inline:-20px; padding-inline:20px; border-radius:8px; border-bottom-color:transparent; }

  .setups{ margin-top:14px; display:flex; flex-direction:column; gap:10px; }
  .setup{ border:1px solid var(--border); border-radius:10px; padding:13px 14px; border-left-width:3px; }
  .setup.long{ border-left-color:var(--good); }
  .setup.short{ border-left-color:var(--critical); }
  .setup-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px; }
  .setup-head .name{ font-weight:600; font-size:13.5px; }
  .pills{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .dir-pill{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; letter-spacing:.06em; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .dir-pill.long{ background:var(--good-soft); color:var(--good-ink); }
  .dir-pill.short{ background:var(--critical-soft); color:var(--critical-ink); }
  .dir-pill.state-bad{ background:var(--critical-soft); color:var(--critical-ink); }
  .dir-pill.state-on{ background:var(--accent-soft); color:var(--accent-ink); }
  .dir-pill.state-wait{ background:var(--surface-2); color:var(--ink-2); }
  .setup-rows{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  @media (max-width:480px){ .setup-rows{ grid-template-columns:repeat(2,1fr); } }
  .srow .k{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .srow .val{ font-size:14px; font-weight:600; margin-top:2px; }
  .setup-note{ margin-top:9px; font-size:12px; color:var(--ink-2); }

  .chart-wrap{ padding:18px 20px 10px; }
  .chart-head{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px 14px; }
  svg.chart{ width:100%; height:auto; display:block; margin-top:8px; overflow:visible; }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; margin-top:2px; font-size:11.5px; color:var(--ink-2); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:10px; height:10px; border-radius:2px; display:inline-block; }

  .tech-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-top:14px; }
  .tech-grid .stat .v{ font-size:14px; }

  .foot-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; }
  @media (max-width:700px){ .foot-grid{ grid-template-columns:1fr; } }
  .foot-grid .panel{ padding:16px 20px; }
  .spec-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin-top:12px; font-size:13px; }
  .spec-grid .k{ color:var(--muted); }
  .spec-grid .v{ font-weight:500; }
  .note{ font-size:12px; color:var(--muted); line-height:1.5; }
  .bias{ font-size:13px; color:var(--ink-2); margin:10px 0 0; line-height:1.55; }
  .timestamp{ font-size:12px; color:var(--muted); text-align:right; }
</style>
</head><body>

     + '</div></div></div><div class="timestamp">'+esc(D.footer)+'</div>';

  document.getElementById('app').innerHTML = h;
  document.title = D.symbol + ' Desk';

  // chart
  var svg = document.getElementById('deskChart'), data = D.chart.bars, refs = D.chart.refs;
  var ns='http://www.w3.org/2000/svg';
  function el(t,a){ var e=document.createElementNS(ns,t); for(var k in a) e.setAttribute(k,a[k]); return e; }
  var W=960,H=300,padL=54,padR=16,padT=14,padB=26,plotW=W-padL-padR,plotH=H-padT-padB;
  var los=data.map(function(d){return d.l;}).concat(refs.map(function(r){return r.p;}));
  var his=data.map(function(d){return d.h;}).concat(refs.map(function(r){return r.p;}));
  var mn=Math.min.apply(null,los), mx=Math.max.apply(null,his), sp=mx-mn, lo=mn-sp*0.04, hi=mx+sp*0.04;
  function y(v){ return padT+plotH*(1-(v-lo)/(hi-lo)); }
  function x(i){ return padL+plotW*(i/(data.length-1)); }
  var dec = D.chart.decimals||0;
  function fmt(v){ return v.toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
  var css=getComputedStyle(document.documentElement);
  function tok(n,f){ return css.getPropertyValue(n).trim()||f; }
  var muted=tok('--muted','#8792A2'),grid=tok('--grid','#E1E5EA'),accent=tok('--accent','#9C6A12'),good=tok('--good','#0CA30C'),critical=tok('--critical','#D03B3B'),border=tok('--border','#D9DFE6');
  var mono='IBM Plex Mono, monospace';
  for(var t=0;t<=5;t++){ var v=lo+(hi-lo)*t/5, yy=y(v);
    svg.appendChild(el('line',{x1:padL,x2:W-padR,y1:yy,y2:yy,stroke:grid,'stroke-width':1}));
    var tl=el('text',{x:padL-8,y:yy+4,'text-anchor':'end','font-size':10,'font-family':mono,fill:muted}); tl.textContent=fmt(v); svg.appendChild(tl); }
  refs.forEach(function(r){ var yy=y(r.p), c=r.kind==='r'?critical:good;
    svg.appendChild(el('line',{x1:padL,x2:W-padR,y1:yy,y2:yy,stroke:c,'stroke-width':1.25,'stroke-dasharray':'4 4',opacity:0.75}));
    var rl=el('text',{x:W-padR-(r.kind==='s'?14:0),y:r.kind==='s'?yy+12:yy-4,'text-anchor':'end','font-size':10,'font-family':mono,fill:c,'font-weight':600}); rl.textContent=fmt(r.p); svg.appendChild(rl); });
  data.forEach(function(d,i){ svg.appendChild(el('line',{x1:x(i),x2:x(i),y1:y(d.h),y2:y(d.l),stroke:border,'stroke-width':data.length>18?5:6,'stroke-linecap':'round'})); });
  svg.appendChild(el('polyline',{points:data.map(function(d,i){return x(i)+','+y(d.c);}).join(' '),fill:'none',stroke:accent,'stroke-width':2.5,'stroke-linejoin':'round','stroke-linecap':'round'}));
  data.forEach(function(d,i){ svg.appendChild(el('circle',{cx:x(i),cy:y(d.c),r:i===data.length-1?4:2.5,fill:accent}));
    if(d.live){ svg.appendChild(el('circle',{cx:x(i),cy:y(d.c),r:5.5,fill:'none',stroke:accent,'stroke-width':2}));
      var ll=el('text',{x:x(i),y:padT-2,'text-anchor':'end','font-size':10,'font-family':mono,fill:accent,'font-weight':600}); ll.textContent='live'; svg.appendChild(ll); } });
  var ev=D.chart.labelEvery||2;
  data.forEach(function(d,i){ var last=i===data.length-1; if(!last&&(i%ev!==0||data.length-1-i<ev)) return;
    var xl=el('text',{x:x(i),y:H-6,'text-anchor':'middle','font-size':10,'font-family':mono,fill:muted}); xl.textContent=d.d; svg.appendChild(xl); });
})(DESK);
</script>
</body></html>
